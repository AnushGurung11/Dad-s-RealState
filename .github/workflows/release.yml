name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (overrides the tag)'
        required: false

defaults:
  run:
    working-directory: app

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write signing keystore from secret
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Convert keystore to JKS if needed
        shell: bash
        run: |
          MAGIC=$(xxd -p -l 4 android/app/release.keystore)
          if [ "$MAGIC" != "feedfeed" ] && [ "$MAGIC" != "cececece" ]; then
            echo "Keystore is not JKS; attempting to convert to JKS..."
            if keytool -importkeystore \
              -srckeystore android/app/release.keystore \
              -srcstoretype PKCS12 -srcstorepass "$ANDROID_STORE_PASSWORD" \
              -srcalias "$ANDROID_KEY_ALIAS" -srckeypass "$ANDROID_KEY_PASSWORD" \
              -destkeystore android/app/release.jks \
              -deststoretype JKS -deststorepass "$ANDROID_STORE_PASSWORD" \
              -destalias "$ANDROID_KEY_ALIAS" -destkeypass "$ANDROID_KEY_PASSWORD" \
              -noprompt 2> conversion-error.log; then
              sed -i 's/storeFile=release.keystore/storeFile=release.jks/' android/key.properties
              echo "Converted to JKS."
            else
              echo "Conversion failed (see error below). Falling back to signing PKCS12 directly with JDK 21."
              cat conversion-error.log
            fi
          else
            echo "Keystore is already JKS/JCEKS; no conversion needed."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version and build code from pubspec
        id: version
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          CODE=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/renttrack-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/renttrack-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/renttrack-*.apk
          generate_release_notes: true

  upload:
    name: Upload APK to Google Drive + notify Discord
    runs-on: ubuntu-latest
    needs: release
    if: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' && secrets.GDRIVE_FOLDER_ID != '' }}
    defaults:
      run:
        working-directory: .
    env:
      SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Upload to Drive and post link to Discord
        shell: bash
        run: |
          chmod +x .github/scripts/upload_drive.sh
          .github/scripts/upload_drive.sh "${{ github.ref_name }}"