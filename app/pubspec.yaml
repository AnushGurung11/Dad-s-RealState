name: lucky
description: "LUCKY — offline rental, bed occupancy and finance tracker for landlords."
publish_to: 'none'

version: 1.11.0+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  country_picker: ^2.0.27
  excel: ^2.1.0
  fl_chart: ^0.70.1
  file_picker: ^12.1.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F6F6F6"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
