name: renttrack
description: "Offline rental and bed occupancy tracker for landlords."
publish_to: 'none'

version: 1.8.0+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F6F6F6"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
